name: "Check Flake"
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**.nix"
      - "**.lock"
      - "**.py"
      - "**.sh"
      - "config/**"
      - "justfile"
      - ".github/workflows/check.yml"
      - ".github/actions/**/*"
  pull_request:
    paths:
      - "**.nix"
      - "**.lock"
      - "**.py"
      - "**.sh"
      - "config/**"
      - "justfile"
      - ".github/workflows/check.yml"
      - ".github/actions/**/*"

permissions:
  contents: read

jobs:
  check-commit:
    name: "Check Commit Message"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run commit message check
        uses: ./.github/actions/commit-message-check

  check-flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          # The action skips its nix-command/flakes defaults when experimental features are configured.
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators

      - name: Check Flake
        run: nix flake check --option allow-import-from-derivation false

      - name: Regression tests
        run: nix develop .#tests --command bash tests/run-tests.sh
